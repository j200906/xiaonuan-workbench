name: 语法护栏

# 云端自迭代会直接往 main 提交代码。模型偶尔会写出语法坏掉的补丁，
# 这里在推送后立刻 node --check 一遍；一旦坏了就自动 revert 上一个提交。

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查 JS 语法
        id: syntax
        continue-on-error: true
        run: |
          fail=0
          for f in assets/*.js; do
            if ! node --check "$f"; then
              echo "::error file=$f::语法检查没通过"
              fail=1
            fi
          done

          # 顺便确认页面引用的文件都还在
          for f in $(grep -oE 'assets/[a-z.]+\.(js|css)' index.html | sort -u); do
            [ -f "$f" ] || { echo "::error file=index.html::引用了不存在的 $f"; fail=1; }
          done

          exit $fail

      - name: 引用完整性
        id: refs
        continue-on-error: true
        run: |
          for id in setProvider fbPull cloudIterCard navEditor ctlPrompt; do
            grep -q "id=\"$id\"" index.html || { echo "::error::index.html 少了 #$id"; exit 1; }
          done

      - name: 坏了就回滚
        if: steps.syntax.outcome == 'failure' || steps.refs.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "xiaonuan-guard"
          git config user.email "guard@users.noreply.github.com"
          git revert --no-edit HEAD || git reset --hard HEAD~1
          git push
          echo "::warning::这次提交没通过检查，已自动回滚"
