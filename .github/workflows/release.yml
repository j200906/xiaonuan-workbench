name: 打包 Windows 程序

# 自迭代只打 tag，不再提前建空 release。
# 这里在 tag 上打 exe，成功后才创建/更新 release；打包失败不会留下空壳。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要补传的 tag（例如 v1.5.0）
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # push 事件用 tag；手动补传用输入的 tag（否则会拿默认分支的代码打旧 tag）
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 版本自检（tag / package.json / changelog / version.js 一致，Q99）
        run: node scripts/check.mjs

      - name: 安装打包工具（精确 pin，同一个 tag 两次打包结果一致）
        # 版本依据（2026-11 查 PyPI）：pyinstaller 6.22.3 要求 python >=3.8,<3.16，覆盖 CI 的 3.12；
        # build_exe.py 用到的 --onefile/--windowed/--add-data/--hidden-import 在 6.x 稳定。
        # hooks-contrib 固定到 6.22.3 声明的最低版本，避免 pip 每次解析出新的 hooks。
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller==6.22.3" "pyinstaller-hooks-contrib==2026.7"
          python -m PyInstaller --version

      - name: 打包
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: python build_exe.py

      - name: 校验产物
        shell: pwsh
        run: |
          if (!(Test-Path dist/XiaoNuan.exe)) { throw "没有生成 dist/XiaoNuan.exe" }
          $size = (Get-Item dist/XiaoNuan.exe).Length
          "体积: {0:N2} MB" -f ($size / 1MB)
          if ($size -lt 1MB) { throw "产物太小，可能没打进去" }
          (Get-FileHash dist/XiaoNuan.exe -Algorithm SHA256).Hash.ToLower() + "  XiaoNuan.exe" |
            Out-File -Encoding ascii dist/XiaoNuan.exe.sha256
          Get-Content dist/XiaoNuan.exe.sha256

      - name: 创建或更新 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:TAG -like 'v*') { $env:TAG } else { $env:DISPATCH_TAG }
          if (!$tag) { throw "拿不到 tag" }
          $notes = "小暖 $tag`n`n由 GitHub Actions 在 Windows 上打包。下载 XiaoNuan.exe 双击即用，数据存在 %APPDATA%\xiaonuan。"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/XiaoNuan.exe dist/XiaoNuan.exe.sha256 --clobber
          } else {
            gh release create $tag dist/XiaoNuan.exe dist/XiaoNuan.exe.sha256 `
              --title "小暖 $tag" --notes $notes --latest
          }
          gh release view $tag --json tagName,assets --jq '{tag: .tagName, assets: [.assets[].name]}'
