services:
  - type: web
    name: xiaonuan-workbench
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: XN_API_KEY
        sync: false
      - key: XN_BASE
        value: https://api.deepseek.com/v1
      - key: XN_MODEL
        value: deepseek-chat
      - key: XN_ADMIN_PASSWORD
        sync: false
